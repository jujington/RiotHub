name: Bug report
description: Something in RiotHub isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include passwords, Riot IDs you want kept private, or screenshots showing personal info.
  - type: input
    id: version
    attributes:
      label: RiotHub version
      description: Shown on the About page in Settings.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - RiotHub Setup.exe (installed)
        - RiotHub.exe (portable)
        - Running from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Accounts page
        2. Click ...
        3. See error
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or diagnostics
      description: Optional. Settings → Export diagnostics makes a zip you can drag in here (it never contains logins or passwords).

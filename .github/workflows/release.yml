# Builds RiotHub.exe + "RiotHub Setup.exe" and publishes a GitHub release
# whenever you push a tag like v11.1  (git tag v11.1 && git push origin v11.1)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Stamp version and update source
        shell: python
        run: |
          import re, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          repo = os.environ["GITHUB_REPOSITORY"]
          p = "RiotHub.pyw"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'(?m)^VERSION = ".*"', f'VERSION = "{tag}"', s, count=1)
          s = re.sub(r'(?m)^UPDATE_REPO = ".*"', f'UPDATE_REPO = "{repo}"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"APP_VERSION={tag}\n")

      - name: Build RiotHub.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "RiotHub" --icon logo.ico --collect-all av RiotHub.pyw

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/RiotHub.exe
            installer/RiotHub Setup.exe
